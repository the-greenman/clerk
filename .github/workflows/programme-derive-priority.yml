name: Programme derive priority

# Reusable. Applies the roadmap's derived epic priorities to the board (clerk roadmap --apply --yes,
# which writes through clerk's gh-project.mjs, the only board-priority writer). Daily (non-push)
# runs also run the steward check with --fix. Triggers (push to default branch, daily cron,
# dispatch) and the concurrency group stay in the caller. github.event_name is the caller's event.
# clerk-ref: as in programme-validate.yml.

on:
  workflow_call:
    inputs:
      clerk-ref:
        description: "Commit SHA of the clerk to run; set it to the same SHA as in the caller's uses: line"
        type: string
        required: true
    secrets:
      BOARD_TOKEN:
        description: "token with repo and project scope"
        required: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the programme
        uses: actions/checkout@v4

      # The clerk at the SAME ref the caller pinned in `uses:` (see clerk-ref above).
      - name: Checkout the clerk
        uses: actions/checkout@v4
        with:
          repository: the-greenman/clerk
          ref: ${{ inputs.clerk-ref }}
          path: .clerk

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply derived priorities
        env:
          GH_TOKEN: ${{ secrets.BOARD_TOKEN }}
          GHP_SCRIPT: ${{ github.workspace }}/.clerk/scripts/gh-project.mjs
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::BOARD_TOKEN secret is not set"
            exit 1
          fi
          clerk() { node "$GITHUB_WORKSPACE/.clerk/bin/clerk.mjs" "$@" --repo "$GITHUB_WORKSPACE"; }
          export $(clerk fetch-srs)
          clerk roadmap --apply --yes

      # Daily only (not on push): reopens false closes and nags missing `Answers:` lines
      # across the governed repos. Needs BOARD_TOKEN to write issues there, not just the board.
      - name: Steward check
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.BOARD_TOKEN }}
        run: |
          clerk() { node "$GITHUB_WORKSPACE/.clerk/bin/clerk.mjs" "$@" --repo "$GITHUB_WORKSPACE"; }
          export $(clerk fetch-srs)
          clerk steward --fix
