name: Programme pages

# Reusable. Publishes the programme's roadmap/ visualiser. roadmap.json is generated here
# (clerk roadmap --json) and never committed. The caller must grant pages: write and
# id-token: write, and holds the triggers and the concurrency group.
# clerk-ref: as in programme-validate.yml.

on:
  workflow_call:
    inputs:
      clerk-ref:
        description: "Commit SHA of the clerk to run; set it to the same SHA as in the caller's uses: line"
        type: string
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout the programme
        uses: actions/checkout@v4

      # The clerk at the SAME ref the caller pinned in `uses:` (see clerk-ref above).
      - name: Checkout the clerk
        uses: actions/checkout@v4
        with:
          repository: the-greenman/clerk
          ref: ${{ inputs.clerk-ref }}
          path: .clerk
          persist-credentials: false

      # srs scans the whole repository root, so a clerk checkout inside it collides with the
      # programme's installed packages (SRS038-R12-DUPLICATE-ID). Keep it outside the tree.
      - name: Move the clerk out of the programme tree
        run: mv .clerk "$RUNNER_TEMP/clerk"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build roadmap.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          clerk() { node "$RUNNER_TEMP/clerk/bin/clerk.mjs" "$@" --repo "$GITHUB_WORKSPACE"; }
          export $(clerk fetch-srs)
          clerk roadmap --json > roadmap/roadmap.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: roadmap
      - id: deployment
        uses: actions/deploy-pages@v4
