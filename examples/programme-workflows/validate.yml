name: Validate

# Thin caller. The gate lives in the clerk. Bump <clerk-sha> in every programme workflow together
# (it appears twice per file: in uses: and in clerk-ref).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  # The pinned srs-rust release supplying the srs CLI. Declared once, here; `clerk fetch-srs` reads it.
  # Advance it in its own commit, stating why.
  SRS_RUST_CLI_TAG: v0.1.0-build.545

jobs:
  validate:
    uses: the-greenman/clerk/.github/workflows/programme-validate.yml@<clerk-sha>
    with:
      clerk-ref: <clerk-sha>
